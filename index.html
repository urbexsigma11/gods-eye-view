<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>God's Eye View</title>
  <!-- Raster fallbacks: Safari ignores an SVG apple-touch-icon and falls back to a
       screenshot of the page, so an installed app needs a real PNG. Regenerate
       these from the logo with `node scripts/generate-icons.mjs`. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <!-- Listed after the PNG: browsers that use the last usable icon keep the SVG
       for the tab. -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="God's Eye" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=add,adjust,ads_click,air,airline_seat_recline_normal,align_horizontal_left,align_horizontal_right,arrow_downward,arrow_drop_down,arrow_forward,arrow_left,arrow_right,arrow_upward,bolt,bug_report,category,chevron_left,chevron_right,close,close_fullscreen,cloud,cyclone,dark_mode,delete,directions_boat,draw,earthquake,east,eco,egg_alt,emergency_home,factory,filter_list,flare,flight,foggy,handyman,history,label,layers,layers_clear,light_mode,local_fire_department,location_city,location_off,location_on,more_horiz,movie,my_location,navigation,newspaper,normal,on,open_in_full,palette,partly_cloudy_day,pause,pedal_bike,pentagon,pest_control,pets,photo_camera,play_arrow,public,question_mark,radar,radio,radio_button_checked,radio_button_unchecked,rainy,raven,restart_alt,right_panel_close,right_panel_open,rocket_launch,satellite_alt,schedule,search,set_meal,settings,skip_next,skip_previous,star,streetview,sunny,thunderstorm,timeline,traffic,train,travel_explore,tune,umbrella,upload_file,videocam,view_in_ar,visibility,visibility_off,warning,water_drop,weather_snowy,zoom_in_map" rel="stylesheet" />
</head>
<body>
  <div class="gev-view" data-gev-view="scene-chrome"></div>
  <div class="gev-view" data-gev-view="cockpit"></div>
  <div class="gev-view" data-gev-view="display-controls"></div>
  <div class="gev-view" data-gev-view="command-dock"></div>
  <div class="gev-view" data-gev-view="layer-panels"></div>
  <div class="gev-view" data-gev-view="context"></div>
  <div class="gev-view" data-gev-view="welcome"></div>
  <div class="gev-view" data-gev-view="provider-settings"></div>
  <!-- Intelligence HUD Overlay -->
  <div class="gev-view" data-gev-view="intel-hud"></div>
  <div id="gev-stories-host" class="gev-view" data-gev-view="stories"></div>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <span class="loader-logo brand-logo" data-logo-gaze data-logo-src="/logo.svg" aria-hidden="true"><img src="/logo.svg" alt="" /></span>
      <h2 translate="no">GOD'S EYE <span class="title-accent">VIEW</span></h2>
      <p class="loader-status" data-i18n>Initializing photorealistic world...</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>

!-- ========================================== -->
<!-- MODUŁ SPOŁECZNOŚCIOWY: DODAJ KAŻDĄ KAMERĘ  -->
<!-- ========================================== -->

<!-- Pływający przycisk "Dodaj kamerę" -->
<button id="cam-hunter-btn" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #dc2626; color: white; border: none; padding: 14px 20px; border-radius: 50px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.5); display: flex; align-items: center; gap: 8px;">
  <span>📷</span> + Dodaj Kamerę (Polska)
</button>

<!-- Okno formularza (Modal) -->
<div id="cam-hunter-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; font-family: sans-serif;">
  <div style="background: #111827; color: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #374151;">
    <h2 style="margin-top: 0; color: #f87171; font-size: 20px;">🕵️‍♂️ CamHunt Poland - Dodaj punkt</h2>
    <p style="font-size: 13px; color: #9ca3af; margin-bottom: 20px;">Zbudujmy mapę polskiego monitoringu! Dodaj kamerę miejską, Wi-Fi, stream z laptopa lub YouTube.</p>
    
    <!-- Nazwa -->
    <label style="display:block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #d1d5db;">NAZWA LOKALIZACJI:</label>
    <input type="text" id="ch-name" placeholder="np. Pruszków - Dworzec / Laptop Pawła" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #4b5563; color: white; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box;">

    <!-- Typ kamery -->
    <label style="display:block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #d1d5db;">RODZAJ KAMERY / ŹRÓDŁA:</label>
    <select id="ch-type" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #4b5563; color: white; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box;">
      <option value="youtube">YouTube Live (Stream publiczny)</option>
      <option value="wifi">Kamera IP / Wi-Fi (Sklep, dom, podwórko)</option>
      <option value="laptop">Prywatny Laptop / Telefon (Lokalny stream)</option>
      <option value="rtsp">Protokół RTSP / HLS (.m3u8)</option>
    </select>

    <!-- Współrzędne GPS -->
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <div style="flex: 1;">
        <label style="display:block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #d1d5db;">SZEROKOŚĆ (LAT):</label>
        <input type="number" id="ch-lat" step="0.0001" value="52.1665" style="width: 100%; padding: 8px; background: #1f2937; border: 1px solid #4b5563; color: white; border-radius: 6px; box-sizing: border-box;">
      </div>
      <div style="flex: 1;">
        <label style="display:block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #d1d5db;">DŁUGOŚĆ (LON):</label>
        <input type="number" id="ch-lon" step="0.0001" value="20.7973" style="width: 100%; padding: 8px; background: #1f2937; border: 1px solid #4b5563; color: white; border-radius: 6px; box-sizing: border-box;">
      </div>
    </div>

    <!-- Link / URL do strumienia -->
    <label style="display:block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #d1d5db;">ADRES STREAMU / LINK DO WIDEO:</label>
    <input type="text" id="ch-url" placeholder="https://youtube.com/... lub rtsp://IP:port/stream" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #4b5563; color: white; border-radius: 6px; margin-bottom: 20px; box-sizing: border-box;">

    <!-- Przyciski akcji -->
    <div style="display: flex; justify-content: flex-end; gap: 10px;">
      <button id="ch-close" style="background: #4b5563; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Anuluj</button>
      <button id="ch-save" style="background: #16a34a; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Opublikuj na mapie 🚀</button>
    </div>
  </div>
</div>

<script>
  const modal = document.getElementById('cam-hunter-modal');
  document.getElementById('cam-hunter-btn').onclick = () => modal.style.display = 'flex';
  document.getElementById('ch-close').onclick = () => modal.style.display = 'none';

  document.getElementById('ch-save').onclick = () => {
    const name = document.getElementById('ch-name').value;
    const type = document.getElementById('ch-type').value;
    const lat = parseFloat(document.getElementById('ch-lat').value);
    const lon = parseFloat(document.getElementById('ch-lon').value);
    const url = document.getElementById('ch-url').value;

    if (!name || !url) {
      alert("Podaj nazwę oraz adres strumienia/link do wideo!");
      return;
    }

    // Obiekt testowej/fake kamery
    const newCameraData = {
      id: "CAM-HUNT-" + Date.now(),
      name: name,
      type: type,
      lat: lat,
      lon: lon,
      url: url,
      addedAt: new Date().toISOString()
    };

    // Zapis w pamięci przeglądarki
    let communityCams = JSON.parse(localStorage.getItem('poland_community_cams') || '[]');
    communityCams.push(newCameraData);
    localStorage.setItem('poland_community_cams', JSON.stringify(communityCams));

    alert("Sukces! Kamera dodana do lokalnej bazy i renderowana na mapie.");
    modal.style.display = 'none';

    // TEST AUTOMATYCZNEGO DODANIA NA MAPĘ:
    // Sprawdzamy czy główna aplikacja posiada funkcję renderującą punkty (np. addEntity lub podobną)
    if (typeof window.viewer !== 'undefined' && window.viewer.entities) {
      window.viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(lon, lat, 10),
        point: {
          pixelSize: 12,
          color: Cesium.Color.RED,
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2
        },
        label: {
          text: name,
          font: '12pt sans-serif',
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          pixelOffset: new Cesium.Cartesian2(0, -20)
        }
      });
      console.log("Dodano punkt bezpośrednio do silnika Cesium!");
    } else {
      // Awaryjne odświeżenie, jeśli silnik łaci punkty z LocalStorage przy starcie
      location.reload();
    }
  };
</script>





</body>
